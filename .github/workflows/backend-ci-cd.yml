name: Backend CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Grant execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run unit and integration tests
        run: ./mvnw test

  deploy:
    name: Automated Deployment
    needs: quality-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Staging Deploy
        if: github.ref == 'refs/heads/staging'
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

      - name: Trigger Render Production Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
