name: Backend CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit and integration tests
        run: ./gradlew test

  deploy:
    name: Automated Deployment
    needs: quality-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Staging Deploy
        if: github.ref == 'refs/heads/staging'
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

      - name: Trigger Render Production Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
