server:
  port: ${PORT:8080}
  # Honour X-Forwarded-* headers from the reverse proxy / load balancer so
  # rate limiting keys on the real client IP instead of the proxy IP.
  forward-headers-strategy: framework

spring:
  application:
    name: cross-pesa
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  data:
      redis:
        host: localhost
        port: 6379

  # 1. Database Connection Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

      # 2. HikariCP Connection Pool Optimization
    hikari:
        pool-name: CrossPesaCP
        maximum-pool-size: 10
        minimum-idle: 5
        idle-timeout: 300000
        connection-timeout: 30000
        max-lifetime: 1800000

  # 3. SQL Schema Initialization Controls
  sql:
    init:
      mode: never
      platform: postgres
      separator: "^^"

  # 4. JPA Configuration
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 5. Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing dev DBs were created by Hibernate ddl-auto; baseline them at V1
    # so V2+ migrations apply cleanly.
    baseline-on-migrate: true
    baseline-version: 1

  web:
    error:
      include-message: always

  docker:
    compose:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,loggers,httpexchanges,scheduledtasks
        exclude: env,beans
  endpoint:
    health:
      show-details: when-authorized
  httpexchanges:
    recording:
      # Privacy: do NOT record principal/remote-address/session-id —
      # they store PII and session identifiers in memory on every request.
      include: time-taken

# 5. Custom App Security Configuration (Top-level root block)
application:
  security:
    jwt:
      # This is a cryptographically secure, Base64-encoded 256-bit secret key
      secret-key: ${JWT_SECRET}
      # Token lifetime setup: 86400000 milliseconds = 24 Hours
      access-token-expiration: ${JWT_EXPIRATION}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}

cross-pesa:
  fx:
    oer:
      app-id: ${OER_APP_ID}
      base-url: ${OER_BASE_URL}

africastalking:
  username: ${AT_USERNAME:sandbox}
  api-key: ${AT_API_KEY}

sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: ${SENDGRID_FROM_EMAIL}

flutterwave:
  secret-key: ${FLW_SECRET_KEY}
  # The main API endpoint
  base-url: https://api.flutterwave.com/v3
  redirect-url: http://localhost:5173/wallet/verify-topup
  webhook-secret: ${FLW_WEBHOOK_SECRET}

# Inbound webhook secrets. If unset, the corresponding webhooks reject all traffic.
webhook:
  payout-secret: ${PAYOUT_WEBHOOK_SECRET:}

smile-id:
  callback-token: ${SMILE_ID_CALLBACK_TOKEN:}



#redis
app:
  redis:
    password: ${REDIS_PASSWORD}
    address: ${REDIS_ADDRESS}
  admin:
    email: ${ADMIN_EMAIL:admin@crosspesa.com}
    password: ${ADMIN_PASSWORD}
  oauth2:
    redirect-base-url: ${OAUTH2_REDIRECT_BASE_URL:http://localhost:5173}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
