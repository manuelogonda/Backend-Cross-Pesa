server:
  port: 8080

spring:
  application:
    name: cross-pesa
  config:
    import: optional:file:.env
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile


  # 1. Database Connection Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    # 2. HikariCP Connection Pool Optimization
    hikari:
      pool-name: CrossPesaCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 2000
      max-lifetime: 1800000

  # 3. SQL Schema Initialization Controls
  sql:
    init:
      mode: never
      platform: postgres
      separator: "^^"

  # 4. JPA Configuration
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  web:
    error:
      include-message: always

  docker:
    compose:
      enabled: false

# 5. Custom App Security Configuration (Top-level root block)
application:
  security:
    jwt:
      # This is a cryptographically secure, Base64-encoded 256-bit secret key
      secret-key: ${JWT_SECRET}
      # Token lifetime setup: 86400000 milliseconds = 24 Hours
      access-token-expiration: ${JWT_EXPIRATION}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}

#flyway:
#  enabled: false
#  baseline-on-migrate: false
#  locations: classpath:db/migration
cross-pesa:
  fx:
    oer:
      app-id: ${OER_APP_ID}

africastalking:
  username: ${AT_USERNAME:sandbox}
  api-key: ${AT_API_KEY}

sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: ${SENDGRID_FROM_EMAIL}