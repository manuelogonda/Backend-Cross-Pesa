services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=crosspesa_db_dev'
      - 'POSTGRES_PASSWORD=cross896'
      - 'POSTGRES_USER=cross_pesa_dev'
    ports:
      - '5432'

  # BLOCK FOR REDIS:
  redis:
    image: redis:latest
    container_name: cross-pesa-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    restart: unless-stopped